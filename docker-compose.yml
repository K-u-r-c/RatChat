services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: "linux/amd64"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 40

  minio:
    image: minio/minio:latest
    platform: "linux/amd64"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  sql-data:
  minio-data: