name: Deploy RatChat

on:
  push:
    branches: [production]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      ROOT_DIR: /home/kurc/applications/RatChat
      API_DIR: /home/kurc/applications/RatChat/API
      CLIENT_DIR: /home/kurc/applications/RatChat/client
      WEB_ROOT: /var/www/ratchat
      COMPOSE_FILE: /home/kurc/applications/RatChat/docker-compose.yml
      DOTNET_VERSION: '9.0.x'
      NODE_VERSION: '20'

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production

      - name: Write .env for compose (secrets → server)
        working-directory: ${{ env.ROOT_DIR }}
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          umask 177
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
          MINIO_ROOT_USER=${MINIO_ROOT_USER}
          MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
          EOF
          chmod 600 .env
          echo ".env written at $(pwd)/.env with 600 perms"

      - name: Ensure Docker services (SQL + MinIO)
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          # Defensive cleanup (nie przerywa joba, jeśli nic nie działa)
          docker compose -f "${COMPOSE_FILE}" down --remove-orphans || true

          sudo systemctl daemon-reload
          sudo systemctl restart docker

          docker compose -f "${COMPOSE_FILE}" up -d --force-recreate sql minio

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate appsettings.json from secrets
        working-directory: ${{ env.API_DIR }}
        env:
          SQL_CONNECTION: ${{ secrets.SQL_CONNECTION }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          RESEND_TOKEN: ${{ secrets.RESEND_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLIENT_APP_URL: ${{ secrets.CLIENT_APP_URL }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: |
          umask 177
          cat > appsettings.json <<'JSON'
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "ConnectionStrings": {
              "DefaultConnection": "__SQL_CONNECTION__"
            },
            "MinIO": {
              "Endpoint": "__MINIO_ENDPOINT__",
              "AccessKey": "__MINIO_ACCESS_KEY__",
              "SecretKey": "__MINIO_SECRET_KEY__",
              "BucketName": "__MINIO_BUCKET__"
            },
            "Resend": {
              "ApiToken": "__RESEND_TOKEN__"
            },
            "Authentication": {
              "GitHub": {
                "ClientId": "__GITHUB_CLIENT_ID__",
                "ClientSecret": "__GITHUB_CLIENT_SECRET__"
              },
              "Google": {
                "ClientId": "__GOOGLE_CLIENT_ID__",
                "ClientSecret": "__GOOGLE_CLIENT_SECRET__"
              }
            },
            "ClientAppUrl": "__CLIENT_APP_URL__",
            "AllowedHosts": "__ALLOWED_HOSTS__"
          }
          JSON
          sed -i "s|__SQL_CONNECTION__|${SQL_CONNECTION//|/\\|}|g" appsettings.json
          sed -i "s|__MINIO_ENDPOINT__|${MINIO_ENDPOINT//|/\\|}|g" appsettings.json
          sed -i "s|__MINIO_ACCESS_KEY__|${MINIO_ACCESS_KEY//|/\\|}|g" appsettings.json
          sed -i "s|__MINIO_SECRET_KEY__|${MINIO_SECRET_KEY//|/\\|}|g" appsettings.json
          sed -i "s|__MINIO_BUCKET__|${MINIO_BUCKET//|/\\|}|g" appsettings.json
          sed -i "s|__RESEND_TOKEN__|${RESEND_TOKEN//|/\\|}|g" appsettings.json
          sed -i "s|__GITHUB_CLIENT_ID__|${GITHUB_CLIENT_ID//|/\\|}|g" appsettings.json
          sed -i "s|__GITHUB_CLIENT_SECRET__|${GITHUB_CLIENT_SECRET//|/\\|}|g" appsettings.json
          sed -i "s|__GOOGLE_CLIENT_ID__|${GOOGLE_CLIENT_ID//|/\\|}|g" appsettings.json
          sed -i "s|__GOOGLE_CLIENT_SECRET__|${GOOGLE_CLIENT_SECRET//|/\\|}|g" appsettings.json
          sed -i "s|__CLIENT_APP_URL__|${CLIENT_APP_URL//|/\\|}|g" appsettings.json
          sed -i "s|__ALLOWED_HOSTS__|${ALLOWED_HOSTS//|/\\|}|g" appsettings.json
          chmod 600 appsettings.json

      - name: Restore & Build backend (Release)
        working-directory: ${{ env.API_DIR }}
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Restart backend (systemd) + healthcheck
        run: |
          sudo systemctl restart ratchat-backend
          sleep 2
          sudo systemctl --no-pager status ratchat-backend || true
          curl -fsS http://10.66.66.2:5000/health || (echo "Backend healthcheck FAILED" && exit 1)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to web root
        run: |
          sudo mkdir -p "${WEB_ROOT}"
          sudo rsync -a --delete "${CLIENT_DIR}/dist/" "${WEB_ROOT}/"
          echo "Frontend deployed to ${WEB_ROOT}"
